<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Play ASUS — Play With Yok</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .view{ display:none; }
  .view.active{ display:flex; }
  #resultView{ flex-direction:column; align-items:center; gap:20px; width:100%; max-width:860px; }
  .role-breakdown{ display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin:8px 0 4px; }
  .role-pill{
    display:flex; align-items:center; gap:8px;
    padding:9px 16px; border-radius:999px;
    background:rgba(255,255,255,0.06); border:1px solid var(--glass-brd);
    font-size:14px; font-weight:600;
  }
  .role-card{
    background:linear-gradient(155deg, rgba(255,255,255,0.10), rgba(255,255,255,0.03));
    border:1.5px solid var(--glass-brd);
    border-radius:var(--r-md);
    padding:20px 16px;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    text-align:center;
    opacity:0; transform:translateY(14px) scale(.92);
    animation:role-in .5s var(--ease-pop) forwards;
  }
  @keyframes role-in{ to{ opacity:1; transform:translateY(0) scale(1);} }
  .role-card .role-icon{ font-size:32px; }
  .role-card.spy{ border-color:rgba(255,77,94,0.5); box-shadow:0 10px 30px -10px rgba(255,77,94,0.35); }
  .role-card.sheriff{ border-color:rgba(95,168,255,0.5); box-shadow:0 10px 30px -10px rgba(95,168,255,0.35); }
  .role-card.doctor{ border-color:rgba(63,224,197,0.5); box-shadow:0 10px 30px -10px rgba(63,224,197,0.35); }
  .role-card.innocent{ border-color:rgba(255,201,60,0.5); box-shadow:0 10px 30px -10px rgba(255,201,60,0.35); }
  .role-name{ font-family:var(--font-display); font-weight:700; font-size:14.5px; }
  .role-card .name{ font-size:16px; font-weight:600; }
</style>
</head>
<body>

<div class="ambient"><span></span><span></span><span></span><span></span><span></span></div>

<div class="stage">
  <div class="topbar">
    <div class="brand"><span class="dot"></span> Play With Yok</div>
    <a href="games.html" class="back-link">← เลือกเกม</a>
  </div>

  <!-- SETUP VIEW -->
  <section id="setupView" class="view active card panel">
    <div class="stack" style="align-items:flex-start;">
      <h1 style="font-size:clamp(24px,4.5vw,32px);">🎭 Play ASUS</h1>
      <p class="muted" style="font-size:15px;">เกมสวมบทบาทลับ ต้องมีผู้เล่นอย่างน้อย 4 คน: ตัวแฝง, นายอำเภอ, หมอ และผู้บริสุทธิ์</p>

      <div class="input-row" style="margin-top:6px;">
        <input id="nameInput" class="input" type="text" placeholder="พิมพ์ชื่อผู้เล่น แล้วกด Enter" maxlength="24">
        <button class="btn sm" id="addBtn" style="flex-shrink:0;">+ เพิ่ม</button>
      </div>
      <div class="chip-list" id="chipList"></div>
      <p class="muted small" id="countHint">ยังไม่มีผู้เล่น (ต้องการอย่างน้อย 4 คน)</p>

      <div style="display:flex; gap:12px; width:100%; margin-top:14px; flex-wrap:wrap;">
        <button class="btn crimson" id="nextBtn" disabled>ถัดไป →</button>
        <button class="btn ghost" id="clearAllBtn">ล้างทั้งหมด</button>
      </div>
    </div>
  </section>

  <!-- CONFIRM VIEW -->
  <section id="confirmView" class="view card panel">
    <div class="center-col" style="width:100%;">
      <h2 style="font-size:24px;">พร้อมสุ่มบทบาทหรือยัง?</h2>
      <p class="muted" id="confirmSummary" style="font-size:15px;"></p>
      <div class="role-breakdown" id="roleBreakdown"></div>
      <div style="display:flex; gap:12px; margin-top:10px; flex-wrap:wrap; justify-content:center;">
        <button class="btn crimson" id="assignBtn">🎲 สุ่มบทบาททั้งหมด</button>
        <button class="btn ghost" id="backBtn">← ย้อนกลับ</button>
      </div>
    </div>
  </section>

  <!-- RESULT VIEW -->
  <section id="resultView" class="view">
    <p class="muted" style="text-align:center;">บทบาทของทุกคนในรอบนี้</p>
    <div class="reveal-grid" id="resultGrid" style="grid-template-columns:repeat(auto-fill, minmax(150px,1fr));"></div>
    <div style="display:flex; gap:12px; flex-wrap:wrap; justify-content:center;">
      <button class="btn crimson" id="reRollBtn">🎲 สุ่มใหม่</button>
      <button class="btn ghost" id="editBtn">✏️ แก้ผู้เล่น</button>
    </div>
  </section>

  <footer class="foot">ระวังตัวแฝงให้ดี... ใครจะรอดจนจบเกม 🕵️</footer>
</div>

<script src="js/sound.js"></script>
<script src="js/play-asus.js"></script>
</body>
</html>
